{% extends "base.html" %}
{% block title %}Criar conta{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm">
  <div class="card-body p-4">
    <h1 class="h4 mb-4">Criar conta</h1>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="username">Usuário</label>
        <input class="form-control" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required>
        <div class="form-text">De 3 a 50 caracteres: letras, números, ponto, hífen ou sublinhado.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Senha</label>
        <input class="form-control" id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="repassword">Repita a senha</label>
        <input class="form-control" id="repassword" name="repassword" type="password" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Criar conta</button>
    </form>
    <p class="mt-3 small mb-0">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
  </div>
</div>
{% endblock %}
