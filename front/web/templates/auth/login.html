{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm">
  <div class="card-body p-4">
    <h1 class="h4 mb-1">Entrar no MyFiles</h1>
    <p class="text-secondary mb-4">Guarde suas imagens, vídeos, áudios e anotações.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="username">Usuário</label>
        <input class="form-control" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Senha</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Entrar</button>
    </form>
    <div class="d-flex justify-content-between mt-3 small">
      <a href="{{ url_for('auth.register') }}">Criar conta</a>
      <a href="{{ url_for('auth.forgot') }}">Esqueci a senha</a>
    </div>
  </div>
</div>
{% endblock %}
