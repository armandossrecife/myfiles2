{% extends "base.html" %}
{% block title %}Recuperar senha{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">Recuperar senha</h1>
    <p class="text-secondary">A recuperação por e-mail ainda não está disponível. Peça ao administrador do sistema para redefinir sua senha.</p>
    <a class="btn btn-outline-secondary" href="{{ url_for('auth.login') }}">Voltar para o login</a>
  </div>
</div>
{% endblock %}
